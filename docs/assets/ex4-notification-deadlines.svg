<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Notification deadlines after a ransomware and SCADA incident at PortNormand</title>
<desc>Deadline chart: CERT-FR declaration without delay, police complaint and CNIL notification within 72 hours, and the future NIS2 24 hour, 72 hour and one month reports.</desc>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Notification deadlines counted from T0 (awareness of the incident)</text>
<line x1="250" y1="76" x2="250" y2="372" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="250" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">T0</text>
<line x1="380" y1="76" x2="380" y2="372" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="380" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">+1 h</text>
<line x1="510" y1="76" x2="510" y2="372" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="510" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">+24 h</text>
<line x1="640" y1="76" x2="640" y2="372" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="640" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">+72 h</text>
<line x1="770" y1="76" x2="770" y2="372" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="770" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">+1 week</text>
<line x1="900" y1="76" x2="900" y2="372" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="900" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">+1 month</text>
<text x="20" y="109" font-size="13" fill="#0f172a">CERT-FR declaration (LPM)</text>
<rect x="250" y="92" width="130" height="26" rx="5" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
<text x="370" y="110" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">without delay</text>
<text x="20" y="157" font-size="13" fill="#0f172a">Criminal complaint (insurance)</text>
<rect x="250" y="140" width="390" height="26" rx="5" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
<text x="630" y="158" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">72 h</text>
<text x="20" y="205" font-size="13" fill="#0f172a">CNIL notification (GDPR)</text>
<rect x="250" y="188" width="390" height="26" rx="5" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
<text x="630" y="206" text-anchor="end" font-size="12" font-weight="bold" fill="#ffffff">72 h</text>
<text x="20" y="253" font-size="13" fill="#0f172a">NIS2 early warning</text>
<rect x="250" y="236" width="260" height="26" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="500" y="254" text-anchor="end" font-size="12" font-weight="bold" fill="#0f172a">24 h</text>
<text x="20" y="301" font-size="13" fill="#0f172a">NIS2 incident notification</text>
<rect x="250" y="284" width="390" height="26" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="630" y="302" text-anchor="end" font-size="12" font-weight="bold" fill="#0f172a">72 h</text>
<text x="20" y="349" font-size="13" fill="#0f172a">NIS2 final report</text>
<rect x="250" y="332" width="650" height="26" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="890" y="350" text-anchor="end" font-size="12" font-weight="bold" fill="#0f172a">1 month after notif.</text>
<line x1="20" y1="226" x2="980" y2="226" stroke="#94a3b8" stroke-width="1"/>
<rect x="40" y="410" width="34" height="16" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
<text x="84" y="423" font-size="13" fill="#0f172a">Binding today (LPM, GDPR, Insurance Code)</text>
<rect x="430" y="410" width="34" height="16" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="474" y="423" font-size="13" fill="#0f172a">Future: NIS2 Article 23, once transposed in France</text>
<text x="40" y="452" font-size="12" fill="#475569">Not to scale. CERT-FR: the law says "without delay"; the +1 h end is our internal target, not a legal limit.</text>
</svg>