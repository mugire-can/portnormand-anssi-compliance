<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Information flows during a cyber incident at PortNormand</title>
<desc>Diagram of information flows between PortNormand, ANSSI/CERT-FR, SGDSN, the Transports ministry, CNIL, law enforcement, qualified providers, CSIRTs and European bodies.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
</defs>
<rect width="1000" height="690" fill="#ffffff"/>
<text x="500" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Information flows during a cyber incident at PortNormand</text>
<rect x="40" y="240" width="220" height="170" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="150.0" y="321.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">PortNormand</text>
<text x="150.0" y="338.0" text-anchor="middle" font-size="12" fill="#334155">DSI, security cell</text>
<text x="150.0" y="353.0" text-anchor="middle" font-size="12" fill="#334155">(8 people), management</text>
<text x="150.0" y="368.0" text-anchor="middle" font-size="12" fill="#334155">OIV, Transports sector</text>
<rect x="380" y="60" width="250" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="505" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">ANSSI</text>
<text x="505" y="104" text-anchor="middle" font-size="12" fill="#334155">authority, control, support</text>
<rect x="400" y="130" width="210" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="505.0" y="181.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">CERT-FR</text>
<text x="505.0" y="198.0" text-anchor="middle" font-size="12" fill="#334155">operational arm:</text>
<text x="505.0" y="213.0" text-anchor="middle" font-size="12" fill="#334155">incident handling, alerts,</text>
<text x="505.0" y="228.0" text-anchor="middle" font-size="12" fill="#334155">indicators of compromise</text>
<rect x="740" y="40" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="66.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">SGDSN</text>
<text x="850.0" y="83.0" text-anchor="middle" font-size="12" fill="#334155">national security coordination</text>
<rect x="740" y="125" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="151.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Transports ministry</text>
<text x="850.0" y="168.0" text-anchor="middle" font-size="12" fill="#334155">sector coordination (to confirm)</text>
<rect x="740" y="210" width="220" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="236.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Other OIV, same sector</text>
<text x="850.0" y="253.0" text-anchor="middle" font-size="12" fill="#334155">shared threat information</text>
<rect x="740" y="295" width="220" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="850.0" y="326.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">ENISA / EU CSIRTs network</text>
<text x="850.0" y="343.0" text-anchor="middle" font-size="12" fill="#334155">other member-state authorities</text>
<rect x="380" y="440" width="250" height="60" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
<text x="505.0" y="466.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">CNIL</text>
<text x="505.0" y="483.0" text-anchor="middle" font-size="12" fill="#334155">personal data protection</text>
<rect x="380" y="540" width="250" height="70" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
<text x="505.0" y="571.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Police / Gendarmerie</text>
<text x="505.0" y="588.0" text-anchor="middle" font-size="12" fill="#334155">public prosecutor (criminal complaint)</text>
<rect x="40" y="470" width="220" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="516.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Qualified providers</text>
<text x="150.0" y="533.0" text-anchor="middle" font-size="12" fill="#334155">PDIS (detection)</text>
<text x="150.0" y="548.0" text-anchor="middle" font-size="12" fill="#334155">PRIS (response)</text>
<text x="150.0" y="563.0" text-anchor="middle" font-size="12" fill="#334155">PASSI (audit)</text>
<rect x="740" y="440" width="220" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="850.0" y="471.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Regional / sectoral CSIRT</text>
<text x="850.0" y="488.0" text-anchor="middle" font-size="12" fill="#334155">e.g. CSIRT Normandie</text>
<line x1="260" y1="275" x2="400" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="325" cy="214" r="11" fill="#0f172a"/>
<text x="325" y="218.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1</text>
<line x1="400" y1="215" x2="260" y2="305" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="335" cy="276" r="11" fill="#0f172a"/>
<text x="335" y="280.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2</text>
<line x1="260" y1="372" x2="380" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<circle cx="318" cy="424" r="11" fill="#0f172a"/>
<text x="318" y="428.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">3</text>
<line x1="260" y1="395" x2="380" y2="575" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<circle cx="305" cy="500" r="11" fill="#0f172a"/>
<text x="305" y="504.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">4</text>
<line x1="150" y1="410" x2="150" y2="470" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<circle cx="150" cy="440" r="11" fill="#0f172a"/>
<text x="150" y="444.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">5</text>
<line x1="630" y1="100" x2="740" y2="70" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<circle cx="685" cy="84" r="11" fill="#0f172a"/>
<text x="685" y="88.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
<line x1="630" y1="150" x2="740" y2="155" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<circle cx="685" cy="153" r="11" fill="#0f172a"/>
<text x="685" y="157.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">6</text>
<line x1="630" y1="205" x2="740" y2="240" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<circle cx="685" cy="224" r="11" fill="#0f172a"/>
<text x="685" y="228.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">7</text>
<line x1="630" y1="255" x2="740" y2="330" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<circle cx="685" cy="293" r="11" fill="#0f172a"/>
<text x="685" y="297.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">8</text>
<line x1="570" y1="270" x2="760" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)" marker-start="url(#ar)"/>
<circle cx="665" cy="355" r="11" fill="#0f172a"/>
<text x="665" y="359.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">9</text>
<line x1="40" y1="640" x2="100" y2="640" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<text x="110" y="645" font-size="13" fill="#0f172a">Legal obligation (LPM, GDPR)</text>
<line x1="350" y1="640" x2="410" y2="640" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="420" y="645" font-size="13" fill="#0f172a">Operational, contractual or indicative flow</text>
<text x="40" y="672" font-size="12" fill="#475569">Numbers refer to the flow table in ex3-actors-map.md. Flows 6 to 9 are indicative: exact channels are not public.</text>
</svg>